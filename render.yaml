services:
  - type: web
    name: bar-live-bridge
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: BAR_TIKTOK_USERNAME
        sync: false
      - key: BAR_ALLOWED_ORIGINS
        sync: false
